  #     action: turn_off
  #     via_args: {domain: light, service: turn_off}
  #   - device: tv_backlight
  #     action: "ON"
  #     via_args: {payload: "ON", qos: 1}
  #   - device: projector_screen
  #     action: lower
  #     # virtual device → no via_args needed
