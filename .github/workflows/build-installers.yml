# JARVIS installer pipeline.
#
# Trigger: push a tag like v0.1.0 (or run manually from the Actions tab).
# Result:  a GitHub Release on that tag with the Windows installers attached:
#          - JARVIS_<version>_x64_en-US.msi        (WiX / MSI)
#          - JARVIS_<version>_x64-setup.exe         (NSIS)
#
# What happens on the runner (windows-latest):
#   1. Python 3.11 + pip install the sidecar's *core* deps only
#      (fastapi, uvicorn, pyyaml, websockets — no torch/whisper/llama).
#   2. PyInstaller builds the windowed one-file exe: dist/jarvis-sidecar.exe
#   3. It is renamed to the Tauri external-binary convention and dropped in
#      shell/binaries/ so `cargo tauri build` picks it up.
#   4. tauri-action builds the NSIS + MSI bundles and attaches them to the
#      release created from the tag.
#
# The installers are SMALL: no ML weights are bundled. The ~10GB of pinned
# models download on first launch, only after the user's explicit consent.

name: build-installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installers (NSIS + MSI)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the sidecar exe (PyInstaller, core profile)
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller fastapi "uvicorn[standard]" pyyaml websockets
          pyinstaller packaging/sidecar.spec
          New-Item -ItemType Directory -Force -Path shell/binaries | Out-Null
          Move-Item -Force dist/jarvis-sidecar.exe `
            shell/binaries/jarvis-sidecar-x86_64-pc-windows-msvc.exe
          Get-Item shell/binaries/jarvis-sidecar-x86_64-pc-windows-msvc.exe |
            Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,1)}}

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Build installers + publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: shell
          tagName: ${{ github.ref_name }}
          releaseName: "JARVIS ${{ github.ref_name }}"
          releaseBody: |
            JARVIS desktop for Windows.

            - No admin rights needed (per-user install).
            - First launch asks before downloading the ~10GB of AI/voice models.
            - Your data lives in %APPDATA%\ai.jarvis.shell and survives upgrades.
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc
